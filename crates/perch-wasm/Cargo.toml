[package]
name = "perch-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PerchClient: the Perch JavaScript API, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# src/backend.rs is the only file that calls the perch-* crates.
perch-core = { workspace = true }
perch-store = { workspace = true }
perch-sync = { workspace = true }
perch-views = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType"] }

[dev-dependencies]
perch-demo = { workspace = true }
