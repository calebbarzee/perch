[workspace]
resolver = "3"
members = [
    "crates/perch-core",
    "crates/perch-store",
    "crates/perch-sync",
    "crates/perch-views",
    "crates/perch-demo",
    "crates/perch-node",
    "crates/perch-wasm",
    "crates/perch-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/calebbarzee/perch"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
perch-core = { path = "crates/perch-core" }
perch-store = { path = "crates/perch-store" }
perch-sync = { path = "crates/perch-sync" }
perch-views = { path = "crates/perch-views" }
perch-demo = { path = "crates/perch-demo" }

# Shared (native + wasm)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"

# Native only
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"

# Wasm only
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Testing
proptest = "1"
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Optimize dependencies (not workspace crates) in dev and test builds.
# Unoptimized Ed25519 verification otherwise dominates test time.
[profile.dev.package."*"]
opt-level = 2
